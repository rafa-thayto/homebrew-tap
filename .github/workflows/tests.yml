name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      # One runner's failure must not cancel the others — a fail-fast cancel used to hide the
      # surviving legs' results entirely (runs went red with the others "canceled").
      fail-fast: false
      matrix:
        # macOS ONLY. This tap ships exactly one thing: the thaytool cask, which is macOS-only
        # (depends_on macos:, installs a .app) and cannot be exercised on Linux at all. The
        # ubuntu leg was also actively harmful: `brew test-bot --only-setup` runs `brew doctor`,
        # which hard-fails on ubuntu-22.04 with "Your system glibc 2.35 is too old" (Homebrew
        # Tier 2), so every run was red for a reason unrelated to the tap's contents.
        os: [ macos-15-intel, macos-26 ]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
