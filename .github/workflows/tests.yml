name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      # One runner's failure must not cancel the others: the macOS legs are what validate the
      # thaytool cask, and a fail-fast cancel meant a Linux-only problem hid their result
      # entirely (every run was red with the macOS legs reported as "canceled").
      fail-fast: false
      matrix:
        # ubuntu-24.04, NOT 22.04: `brew test-bot --only-setup` runs `brew doctor`, which now
        # FAILS on 22.04 with "Your system glibc 2.35 is too old" (a Homebrew Tier 2 config).
        # 24.04 ships glibc 2.39, so doctor passes. Linux is kept because Formula/resend.rb has
        # real on_linux builds; the thaytool cask itself is macOS-only and is exercised by the
        # macOS legs.
        os: [ ubuntu-24.04, macos-15-intel, macos-26 ]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
